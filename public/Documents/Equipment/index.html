<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIT - UNITED NATIONS INTELLIGENCE TASKFORCE</title>

    <!-- Discord / Open Graph Embed Tags -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="UNIT Web">
    <meta property="og:title" content="UNIT Equipments">
    <meta property="og:description" content="All info about allowed equipments">
    <meta property="og:url" content="https://unitweb.sytes.net/Documnets/Equipment">
    <meta property="og:image" content="https://unitweb.sytes.net/icon.png">
    <meta name="theme-color" content="#009EDB">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Styles and Scripts -->
    <link rel="icon" type="image/x-icon" href="/icon.png">
    <script src="https://kit.fontawesome.com/ce255f3d20.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.1/mdb.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="./equipment.css">
</head>
<body class="iosevka-charon-regular">
    <!-- Navbar -->
    <section id="navbar"></section>
    <!-- Main -->
    <section id="main">
        <section id="qualifications-container" class="qualsContainer"></section>

        <!-- Template for the Category Headers -->
        <template id="category-template">
            <div class="categorySection">
                <h2 class="categoryTitle roboto-condensed-black"><u></u></h2>
                <div class="qualsList"></div>
            </div>
        </template>

        <!-- Template for the individual Accordion Items -->
        <template id="qual-template">
            <div class="accordionItem">
                <div class="accordionHeader">
                    <span class="qualName"></span>
                    <span class="accordionArrow">▼</span>
                </div>
                <!-- Grid container for animation -->
                <div class="accordionContent">
                    <!-- Inner wrapper to hide overflow during transition -->
                    <div class="accordionInner">
                        <ul class="qualDesc"></ul>
                        <p class="qualCriteria"><u><strong></strong></u></p>
                    </div>
                </div>
            </div>
        </template>
    </section>
    <!-- Footer -->
    <section id="footer"></section>
    <script src="./equipment.js" async defer type="module"></script>
    <script src="/util/LanguageSwitching/lang.js" async defer type="module"></script>
</body>
</html>
