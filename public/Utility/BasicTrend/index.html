<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Font awesome -->
    <script src="https://kit.fontawesome.com/ce255f3d20.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <!-- MDB -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.1/mdb.min.css" rel="stylesheet"/>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>UNIT - UNITED NATIONS INTELLIGENCE TASKFORCE</title>
    <!-- <link rel="preload" href="./homepage.css" as="style">
    <link rel="preload" href="./homepage.js" as="script"> -->
    <link rel="stylesheet" href="./basicTrend.css">
</head>
<body class="iosevka-charon-regular">
    <!-- Navbar -->
    <section id="navbar"></section>
    <!-- Main -->
    <section id="main">
        <div class="trends">
            <img src="img/unitBlueNoTxt.png" alt="" class="bgLogo">
            <h3 class="roboto-condensed-semibold">Bar chart of amount of new members joined per month</h3>
            <canvas id="chartJoinDate"></canvas>
            <!-- <p class="roboto-condensed-light">Last updated: 13th August 2026</p> -->
        </div>
        <div class="trends">
            <img src="img/unitBlueNoTxt.png" alt="" class="bgLogo">
            <h3 class="roboto-condensed-semibold">Map of amount of members across the globe</h3>
            <div id="chartMap" style="height: 500px; width: 100%; border-radius: 8px;"></div>
            <div class="indicator">
                <div class="bar"></div>
                <div class="indicatorTxt">
                    <span>Low</span>
                    <span>High</span>
                </div>
            </div>
            <!-- <p class="roboto-condensed-light">Last updated: 13th August 2026</p> -->
        </div>
        <div class="trends">
            <img src="img/unitBlueNoTxt.png" alt="" class="bgLogo">
            <h3 class="roboto-condensed-semibold">Histogram of points each member has</h3>
            <canvas id="pointsHistogram"></canvas>
            <!-- <p class="roboto-condensed-light">Last updated: 13th August 2026</p> -->
        </div>
    </section>
    <!-- Footer -->
    <section id="footer"></section>
    <script src="./basicTrend.js" async defer type="module"></script>
    <script src="/util/LanguageSwitching/lang.js" async defer type="module"></script>
</body>
</html>
